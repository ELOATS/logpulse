services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: loganalyzer
      POSTGRES_DB: loganalyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loganalyzer"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://loganalyzer:loganalyzer@postgres:5432/loganalyzer?sslmode=disable
      ANALYZE_INTERVAL: 1m
      # 日志保留天数（按天删除整个分区），0 表示不清理
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # 设置后启用 AI 异常分析（读取宿主机环境变量或 .env 文件）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
