services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: loganalyzer
      POSTGRES_DB: loganalyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loganalyzer"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://loganalyzer:loganalyzer@postgres:5432/loganalyzer?sslmode=disable
      ANALYZE_INTERVAL: 1m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
